name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  android-compile:
    name: Android 编译（纯 Java）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 准备 Android SDK 组件
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

  ios-compile:
    name: iOS 编译（纯 Swift / SwiftUI）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen 并生成工程
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 编译（模拟器 SDK，不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project BaoziVideo.xcodeproj \
            -scheme BaoziVideo \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
