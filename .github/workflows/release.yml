name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  android:
    name: 编译 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 组件
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 编译 Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 收集产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/xiaobaozi-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: 编译未签名 IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen 并生成工程
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project BaoziVideo.xcodeproj \
            -scheme BaoziVideo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/BaoziVideo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: 打包为未签名 IPA
        run: |
          mkdir -p dist
          APP=$(find ios/build/BaoziVideo.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          rm -rf ios/Payload && mkdir -p ios/Payload
          cp -R "$APP" ios/Payload/
          (cd ios && zip -qry "$OLDPWD/dist/xiaobaozi-${GITHUB_REF_NAME}-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: 发布
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 Source JSON、更新清单与发布说明
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/make_release_meta.py

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          ASSETS="dist/*.apk dist/*.ipa source/xiaobaozi.json source/latest.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" --title "小包子影视 $TAG" --notes-file RELEASE_NOTES.md $ASSETS
          fi
